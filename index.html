<!doctype html>
<!-- L'attribut lang est mis à jour par l'application (français ou allemand, selon le choix retenu sur ce poste). -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan2CPE — des plans aux valeurs de LuxEeB-Tool</title>
    <meta
      name="description"
      content="Plan2CPE lit vos plans (IFC, DWG, DXF, PDF, images) et prépare les valeurs à saisir dans LuxEeB-Tool pour le certificat de performance énergétique. Tout reste sur votre ordinateur. — Plan2CPE liest Ihre Pläne und bereitet die Eingabewerte für LuxEeB-Tool (Energiepass) vor. Alles bleibt auf Ihrem Rechner."
    />
    <meta name="application-name" content="Plan2CPE" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2126" media="(prefers-color-scheme: dark)" />
    <!-- Application locale : aucune adresse n'est transmise à l'extérieur, rien n'est à indexer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Les deux langues de l'interface : inutile de proposer une traduction automatique. -->
    <meta name="google" content="notranslate" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%230f6b62'/%3E%3Cpath d='M12.5 17.5l2.4 2.4 4.6-5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* Avant le chargement de l'application : même fond que l'interface, clair ou sombre. */
      html {
        background: #f6f4ef;
        color: #1f2a30;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #12161a;
          color: #e8ecee;
        }
      }
      .boot {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="boot">
        <p lang="fr">
          <strong>Plan2CPE a besoin de JavaScript.</strong> L'application lit vos plans directement dans ce navigateur, sans rien envoyer : activez
          JavaScript pour l'utiliser.
        </p>
        <p lang="de">
          <strong>Plan2CPE benötigt JavaScript.</strong> Die Anwendung liest Ihre Pläne direkt in diesem Browser, ohne etwas zu versenden: Aktivieren Sie
          JavaScript, um sie zu nutzen.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
