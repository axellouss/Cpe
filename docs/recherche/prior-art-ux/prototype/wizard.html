<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPE pre-fill - UX spike</title>
<!--
  UX SPIKE ONLY. Single file, no dependencies, no network.
  - The "plan reading result" is a hard-coded demo object (DEMO_PLAN): nothing is read from a real plan here.
  - The U-values per construction period (PERIODS) are ILLUSTRATIVE PLACEHOLDERS, not official Luxembourg values.
  - The geometry maths is a rectangular-box simplification, good enough to show live feedback, not a CPE method.
-->
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1f2933; --mut:#5f6b7a; --line:#d9d4c7; --acc:#0b6e69; --acc2:#e8f3f2;
          --hi:#2e7d32; --mid:#b26a00; --lo:#b3261e; --heat:#f6c9a8; --cold:#cfe0f3; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:2; }
  header .title { font-weight:700; margin-right:auto; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
           border-radius:8px; padding:8px 12px; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }
  button.ghost { border-color:transparent; color:var(--acc); text-decoration:underline; padding:4px 6px; }
  button[aria-pressed="true"], .opt.sel { outline:3px solid var(--acc); background:var(--acc2); }
  button:disabled { opacity:.45; cursor:default; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .meters { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--mut); }
  .meter { min-width:150px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--acc); transition:width .35s; }
  .bar.conf > i { background:var(--mid); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:12px 0; }
  h1 { font-size:24px; margin:0 0 6px; text-wrap:balance; }
  .cap { color:var(--mut); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  .why { color:var(--mut); font-size:14px; margin:6px 0 14px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin:12px 0; }
  .opt { text-align:left; min-height:64px; }
  .opt small { display:block; color:var(--mut); }
  .row { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-of-type { border-top:0; }
  .row .k { width:170px; color:var(--mut); }
  .row .v { flex:1; min-width:160px; font-weight:600; }
  .chip { font-size:12px; border-radius:10px; padding:2px 8px; color:#fff; white-space:nowrap; }
  .chip.hi { background:var(--hi); } .chip.mid { background:var(--mid); } .chip.lo { background:var(--lo); }
  .chip.src { background:#e9e6dd; color:var(--ink); }
  .nav { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .levels { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  svg.plan { width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  svg.plan rect.room { stroke:#333; stroke-width:.06; cursor:pointer; }
  svg.plan rect.heated { fill:var(--heat); } svg.plan rect.unheated { fill:var(--cold); }
  svg.plan text { font-size:.42px; pointer-events:none; }
  .legend span { display:inline-block; width:14px; height:14px; vertical-align:-2px; border:1px solid #333; margin:0 4px 0 12px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  td.num { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  input[type=number], input[type=text] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:110px; }
  .compass { touch-action:none; cursor:grab; }
  .live { font-size:14px; color:var(--mut); margin-top:8px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 14px;
           border-radius:8px; display:flex; gap:12px; align-items:center; }
  .toast button { background:transparent; color:#fff; border-color:#fff; padding:4px 10px; }
  .overflow { overflow-x:auto; }
  :focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
</style>
</head>

};
const DIRS = { fr:['N','NE','E','SE','S','SO','O','NO'], de:['N','NO','O','SO','S','SW','W','NW'] };
const t = k => (T[state.lang][k] ?? k);

/* ---------- demo "plan reading" result (hard-coded) ---------- */
const DEMO_PLAN = {
  file:'demo_maison_1974.pdf',
  address:{ v:'12, rue des Champs, L-7240 Bereldange', conf:.9 },
  planYear:{ v:1974, conf:.8 }, scale:{ v:'1:100', conf:.95 }, northDeg:{ v:20, conf:.6 }, dwellings:{ v:1, conf:.85 },
  footprint:{ w:10.24, d:9.24, conf:.9 },
  levels:[
    { id:'KG', n:{fr:'Sous-sol',de:'Kellergeschoss'}, h:2.45, rooms:[
      {id:'k1', n:{fr:'Cave',de:'Keller'}, x:.3,y:.3,w:4.7,h:4.2, a:19.7, heated:false},
      {id:'k2', n:{fr:'Chaufferie',de:'Heizraum'}, x:5.2,y:.3,w:4.7,h:2.6, a:12.2, heated:false},
      {id:'k3', n:{fr:'Garage',de:'Garage'}, x:.3,y:4.7,w:5.6,h:4.2, a:23.5, heated:false},
      {id:'k4', n:{fr:'Buanderie',de:'Waschküche'}, x:6.1,y:3.1,w:3.8,h:5.8, a:22.0, heated:false} ]},
    { id:'EG', n:{fr:'Rez-de-chaussée',de:'Erdgeschoss'}, h:2.80, rooms:[
      {id:'e1', n:{fr:'Séjour',de:'Wohnzimmer'}, x:.3,y:.3,w:5.6,h:5.6, a:31.4, heated:true},
      {id:'e2', n:{fr:'Cuisine',de:'Küche'}, x:6.1,y:.3,w:3.8,h:3.7, a:14.1, heated:true},
      {id:'e3', n:{fr:'Hall',de:'Diele'}, x:6.1,y:4.2,w:3.8,h:2.6, a:9.9, heated:true},
      {id:'e4', n:{fr:'Bureau',de:'Büro'}, x:.3,y:6.1,w:5.6,h:2.8, a:15.7, heated:true},
      {id:'e5', n:{fr:'WC',de:'WC'}, x:6.1,y:7.0,w:3.8,h:1.9, a:7.2, heated:true} ]},
    { id:'OG', n:{fr:'Étage',de:'Obergeschoss'}, h:2.80, rooms:[
      {id:'o1', n:{fr:'Chambre 1',de:'Zimmer 1'}, x:.3,y:.3,w:5.0,h:4.0, a:20.0, heated:true},
      {id:'o2', n:{fr:'Chambre 2',de:'Zimmer 2'}, x:5.5,y:.3,w:4.4,h:4.0, a:17.6, heated:true},
      {id:'o3', n:{fr:'Chambre 3',de:'Zimmer 3'}, x:.3,y:4.5,w:5.0,h:4.4, a:22.0, heated:true},
      {id:'o4', n:{fr:'Salle de bain',de:'Bad'}, x:5.5,y:4.5,w:4.4,h:2.4, a:10.6, heated:true},
      {id:'o5', n:{fr:'Palier',de:'Flur'}, x:5.5,y:7.1,w:4.4,h:1.8, a:7.9, heated:true} ]},
    { id:'DG', n:{fr:'Grenier',de:'Speicher'}, h:2.20, rooms:[
      {id:'d1', n:{fr:'Grenier',de:'Speicher'}, x:.3,y:.3,w:9.6,h:8.6, a:82.6, heated:false} ]}
  ],
  /* side = plan side the facade is drawn on (top/right/bottom/left); n = number of identical openings */

};

/* ILLUSTRATIVE PLACEHOLDER default U-values per construction period - NOT official Luxembourg values */
const PERIODS = [
  {id:'p1', lab:'< 1919',    y:1900, U:{wall:1.7, top:1.2, floor:1.2, win:2.8}},
  {id:'p2', lab:'1919-1948', y:1935, U:{wall:1.6, top:1.1, floor:1.2, win:2.8}},
  {id:'p3', lab:'1949-1968', y:1960, U:{wall:1.4, top:0.9, floor:1.0, win:2.8}},
  {id:'p4', lab:'1969-1983', y:1975, U:{wall:1.0, top:0.6, floor:0.8, win:2.8}},
  {id:'p5', lab:'1984-1994', y:1990, U:{wall:0.6, top:0.4, floor:0.6, win:2.6}},
  {id:'p6', lab:'1995-2007', y:2000, U:{wall:0.45, top:0.3, floor:0.5, win:1.7}},
  {id:'p7', lab:'2008-2016', y:2012, U:{wall:0.30, top:0.2, floor:0.35, win:1.3}},
  {id:'p8', lab:'> 2016',    y:2020, U:{wall:0.17, top:0.13, floor:0.25, win:0.9}}
];
const periodOfYear = y => PERIODS.find((p,i) => i===PERIODS.length-1 || y < [1919,1949,1969,1984,1995,2008,2017][i]);

/* ---------- state + undo ---------- */
const state = { lang:'fr', expert:false, step:0, plan:null, confirmed:false, editing:null, answers:{}, toast:null };
const history = [];
const stats = { clicks:0, keys:0 };
function commit(fn) { history.push(JSON.stringify({ step:state.step, plan:state.plan, confirmed:state.confirmed, answers:state.answers })); fn(state); state.toast=null; render(); }
function undo() {
  if (!history.length) { state.toast = t('nothing'); return render(); }
  Object.assign(state, JSON.parse(history.pop())); state.editing=null; state.toast = t('undone'); render();
}

/* ---------- derived values: everything the result table shows ---------- */
function sector(az) { return ((Math.round(az/45) % 8) + 8) % 8; }
function derive() {
  const p = state.plan, a = state.answers, out = [];
  const F = (id, grp, v, unit, src, conf) => out.push({ id, grp, v, unit, src, conf });
  if (!p) return out;
  const ok = state.confirmed ? .97 : null;
  F('address','A', p.address.v, '', p.address.src||'plan', ok ?? p.address.conf);
  F('dwellings','A', p.dwellings.v, '', p.dwellings.src||'plan', ok ?? p.dwellings.conf);
  F('occasion','A', a.occasion ?? null, '', 'you', 1);
  const year = a.year ?? null, per = a.period ? PERIODS.find(x => x.id===a.period) : null;
  F('year','A', year ?? (per ? per.lab : null), '', 'you', 1);
  /* geometry */
  const heatedLv = p.levels.filter(l => { const ar = l.rooms.reduce((s,r)=>s+r.a,0), h = l.rooms.filter(r=>r.heated).reduce((s,r)=>s+r.a,0); return h > ar/2; });
  const An = p.levels.flatMap(l => l.rooms).filter(r => r.heated).reduce((s,r)=>s+r.a,0);
  const H = heatedLv.reduce((s,l)=>s+l.h,0), fpA = p.footprint.w*p.footprint.d;
  const zoneConf = a.zoneOk ? 1 : .55;
  F('An','B', +An.toFixed(1), 'm²', 'plan', Math.min(zoneConf, p.footprint.conf));
  F('Ve','B', +(fpA*H).toFixed(0), 'm³', 'calc', Math.min(zoneConf, .8));
  const sides = { top:0, right:90, bottom:180, left:270 }, len = { top:p.footprint.w, bottom:p.footprint.w, left:p.footprint.d, right:p.footprint.d };
  const wall = Array(8).fill(0), win = Array(8).fill(0);
  for (const s in sides) wall[sector(p.northDeg.v + sides[s])] += len[s]*H;
  for (const w of p.windows) win[sector(p.northDeg.v + sides[w.side])] += w.w*w.h*w.n;
  const doorA = p.door.w*p.door.h; wall[sector(p.northDeg.v + sides[p.door.side])] -= doorA;
  const nConf = Math.min(zoneConf, ok ?? p.northDeg.conf);
  for (let i=0;i<8;i++) if (wall[i] > 0) { F('wall_'+i,'C', +(wall[i]-win[i]).toFixed(1), 'm²', 'calc', nConf); if (win[i]>0) F('win_'+i,'C', +win[i].toFixed(1), 'm²', 'plan', Math.min(nConf,.8)); }
  F('door','C', +doorA.toFixed(1), 'm²', 'plan', .8);
  const kgHeated = heatedLv.some(l => l.id==='KG'), dgHeated = heatedLv.some(l => l.id==='DG');
  F(dgHeated ? 'roof' : 'topceil','C', +(dgHeated ? fpA/Math.cos(35*Math.PI/180) : fpA).toFixed(1), 'm²', 'calc', zoneConf);
  F(kgHeated ? 'slab' : 'cellarceil','C', +fpA.toFixed(1), 'm²', 'calc', zoneConf);
  /* constructions: default by period, overridden by renovation answers */
  const U = per ? { ...per.U } : { wall:null, top:null, floor:null, win:null }, src = { wall:'def', top:'def', floor:'def', win:'def' }, r = a.reno || {};
  const lam = 0.035, add = (u, cm) => +(1/(1/u + (cm/100)/lam)).toFixed(2);
  if (per && r.wall) { U.wall = add(U.wall, r.wallCm ?? 12); src.wall='you'; }
  if (per && r.roof) { U.top = add(U.top, r.roofCm ?? 16); src.top='you'; }
  if (per && r.floor) { U.floor = add(U.floor, r.floorCm ?? 8); src.floor='you'; }
  if (per && r.win) { U.win = periodOfYear(r.winYear ?? 2010).U.win; src.win='you'; }
  const renoKnown = a.reno !== undefined;
  for (const k of ['wall','top','floor','win']) F('U_'+k,'D', U[k], 'W/m²K', src[k], per ? (src[k]==='you' ? .8 : (renoKnown ? .55 : .35)) : 0);
